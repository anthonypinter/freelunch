<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lunch Games | My Profile</title>
  <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Lunch Games" />
  <link rel="manifest" href="/images/favicon/site.webmanifest" />
  <link rel="stylesheet" href="https://use.typekit.net/otp1fyf.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:      #000000;
      --white:      #ffffff;
      --gold:       #CFB87C;
      --gray-light: #A2A4A3;
      --gray-lighter: #E8E8E8;

      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-500:  #6b7280;
      --gray-200:  #e5e7eb;
      --gray-100:  #f3f4f6;
      --red-600:   #dc2626;
      --red-100:   #fee2e2;
      --red-700:   #b91c1c;
      --amber-100: #fef3c7;
      --amber-700: #b45309;

      --font-display: "cheap-pine", sans-serif;
      --font-body:    "ivystyle-sans", sans-serif;

      --radius:    12px;
    }

    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Header ── */
    .page-header {
      background: var(--black);
      flex-wrap: wrap;
      row-gap: .5rem;
      padding: .75rem clamp(1.25rem, 4vw, 2.5rem);
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem 1rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.35rem);
      letter-spacing: .03em;
      color: var(--gold);
      white-space: nowrap;
    }
    .logo-divider {
      color: var(--gray-light);
      font-size: 1.1rem;
      font-weight: 700;
    }
    .mod-link {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .85rem;
      color: var(--white);
      transition: color .2s;
      white-space: nowrap;
    }
    .mod-link:hover { color: var(--gold); }
    .header-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem clamp(1rem, 3vw, 2rem);
    }
    .header-links a {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: clamp(.75rem, 1.6vw, .85rem);
      color: var(--white);
      transition: color .2s;
      white-space: nowrap;
    }
    .header-links a:hover { color: var(--gold); }
    @media (max-width: 700px) {
      .page-header { justify-content: center; text-align: center; min-height: 110px; }
      .logo-group, .header-links { justify-content: center; width: 100%; }
      .logo { font-size: 2.1rem; }
    }
    .signout-btn {
      background: none;
      border: 2px solid var(--gold);
      color: var(--gold);
      padding: .45rem 1.1rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .signout-btn:hover { background: var(--gold); color: var(--black); }

    /* ── Page layout ── */
    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    /* ── Profile card ── */
    .profile-card {
      background: var(--gray-lighter);
      border: 1px solid rgba(207,184,124,.6);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 560px) {
      .profile-card { flex-direction: column; text-align: center; padding: 1.25rem; }
    }

    /* Avatar */
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 170px; height: 170px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--black);
      font-size: 3.6rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    #avatar-input { display: none; }
    .change-avatar-btn {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: var(--font-body);
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: rgba(0,0,0,0);
      color: transparent;
      border: none;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .avatar-wrap:hover .change-avatar-btn,
    .change-avatar-btn:focus-visible {
      background: rgba(0,0,0,.6);
      color: var(--white);
    }

    /* Identity */
    .profile-identity { flex: 1; min-width: 0; }
    .profile-identity h1 {
      font-family: var(--font-display);
      font-weight: 400;
      color: var(--black);
      font-size: 2.8rem;
      letter-spacing: .02em;
      overflow-wrap: break-word;
    }
    .profile-handle {
      font-size: .9rem;
      color: var(--gray-700);
      margin-top: .2rem;
    }

    /* Stats */
    .stats-row {
      display: flex;
      gap: clamp(.5rem, 2vw, 1.5rem);
      margin-top: 1.1rem;
      flex-wrap: nowrap;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border: 1px solid rgba(0,0,0,.1);
      border-radius: 8px;
      padding: .6rem .3rem;
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--black);
      line-height: 1;
    }
    .stat-label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-top: .25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    @media (max-width: 560px) {
      .stats-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        justify-content: center;
      }
      .stat { width: auto; }
    }

    /* Log meal CTA */
    .log-btn {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      margin-bottom: 1.5rem;
      padding: .8rem 1.3rem;
      background: var(--gold);
      color: var(--black);
      border: 2px solid var(--gold);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-decoration: none;
      transition: background .2s, color .2s;
    }
    .log-btn:hover { background: var(--black); color: var(--gold); }

    /* ── Meals section ── */
    .meals-heading {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--white);
      margin-bottom: 1rem;
    }

    .meals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .meal-card {
      background: var(--gray-lighter);
      border: 1px solid rgba(207,184,124,.4);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .2s;
    }
    .meal-card:hover { border-color: var(--gold); }

    .meal-photo {
      aspect-ratio: 4/3;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .meal-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .meal-no-photo { font-size: 2.5rem; }

    .meal-info {
      padding: .85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .meal-desc {
      font-size: .9rem;
      font-weight: 500;
      color: var(--black);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    .meal-how {
      font-size: .8rem;
      color: var(--gray-700);
      line-height: 1.4;
    }
    .meal-date {
      font-size: .75rem;
      color: var(--gray-700);
    }
    .delete-btn {
      margin-top: .4rem;
      align-self: flex-start;
      background: none;
      border: none;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--gray-700);
      cursor: pointer;
      padding: 0;
      transition: color .2s;
    }
    .delete-btn:hover { color: var(--red-600); }

    /* ── Status badges ── */
    .status-badge {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      border-radius: 999px;
      padding: .2rem .6rem;
      margin-bottom: .35rem;
    }
    .status-pending  { background: var(--amber-100); color: var(--amber-700); }
    .status-rejected { background: var(--red-100);   color: var(--red-700); }

    /* ── Empty / loading ── */
    .empty-msg, .loading-msg {
      color: var(--gray-light);
      font-size: .95rem;
      padding: 2rem 0;
    }
    .empty-msg a { color: var(--gold); font-weight: 700; text-decoration: none; }
    .empty-msg a:hover { text-decoration: underline; }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: clamp(.75rem, 3vw, 1.5rem);
      padding: 1rem clamp(1.25rem, 4vw, 2.5rem) clamp(1.5rem, 5vh, 3.5rem);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: clamp(.65rem, 1.6vw, .85rem);
      text-transform: uppercase;
      color: var(--white);
    }
    .footer-link {
      text-decoration: none;
      color: var(--white);
      justify-self: end;
    }
    .footer-link:hover { color: var(--white); }
    .footer-logo { height: clamp(34px, 6vh, 54px); width: auto; justify-self: center; }
    .footer-text { justify-self: start; }

    @media (max-width: 560px) {
      footer {
        grid-template-columns: 1fr;
        justify-items: center;
        row-gap: .6rem;
        text-align: center;
      }
      .footer-link, .footer-text { justify-self: center; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="logo-group">
      <a href="index.html" class="logo">THE LUNCH GAMES</a>
      <span class="logo-divider" aria-hidden="true">|</span>
      <a href="moderation.html" id="mod-nav-link" class="mod-link" hidden>Moderation</a>
    </div>
    <nav class="header-links">
      <a href="index.html">Home</a>
      <a href="faq.html">FAQs</a>
      <a href="dashboard.html">Dashboard</a>
      <button class="signout-btn" id="signout-btn">Sign out</button>
    </nav>
  </header>

  <main>

    <!-- Profile card -->
    <div class="profile-card">
      <div class="avatar-wrap">
        <div class="avatar" id="profile-avatar"></div>
        <input type="file" id="avatar-input" accept="image/*">
        <button class="change-avatar-btn" id="change-avatar-btn">Change<br>Photo</button>
      </div>

      <div class="profile-identity">
        <h1 id="profile-name">…</h1>
        <p class="profile-handle" id="profile-handle"></p>

        <div class="stats-row">
          <div class="stat">
            <span class="stat-value" id="stat-total">—</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-weekly">—</span>
            <span class="stat-label">This Week</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-monthly">—</span>
            <span class="stat-label">This Month</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-semester">—</span>
            <span class="stat-label">This Semester</span>
          </div>
        </div>
      </div>
    </div>

    <a href="submit.html" class="log-btn">+ Log a Meal</a>

    <!-- Meal history -->
    <h2 class="meals-heading">My Meals</h2>
    <div id="meals-grid" class="meals-grid">
      <p class="loading-msg">Loading…</p>
    </div>

  </main>

  <footer>
    <a href="https://lab.whaaat.io" class="footer-link">From the humans of whaaaat!?</a>
    <img src="images/silversaucerlogo.svg" alt="The Society of the Silver Saucers" class="footer-logo">
    <span class="footer-text">The society of the silver saucers</span>
  </footer>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
