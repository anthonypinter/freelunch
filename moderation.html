<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lunch Games | Moderation</title>
  <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Lunch Games" />
  <link rel="manifest" href="/images/favicon/site.webmanifest" />
  <link rel="stylesheet" href="https://use.typekit.net/otp1fyf.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:        #000000;
      --white:        #ffffff;
      --gold:         #CFB87C;
      --gray-light:   #A2A4A3;
      --gray-lighter: #E8E8E8;

      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-500:  #6b7280;
      --green-100: #d8f3dc;
      --green-500: #40916c;
      --green-700: #2d6a4f;
      --amber-100: #fef3c7;
      --amber-700: #b45309;
      --red-100:   #fee2e2;
      --red-600:   #dc2626;
      --red-700:   #b91c1c;

      --font-display: "cheap-pine", sans-serif;
      --font-body:    "ivystyle-sans", sans-serif;

      --radius:    12px;
    }

    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Header ── */
    .page-header {
      background: var(--black);
      flex-wrap: wrap;
      row-gap: .5rem;
      padding: .75rem clamp(1.25rem, 4vw, 2.5rem);
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .75rem 1rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.35rem);
      letter-spacing: .03em;
      color: var(--gold);
      white-space: nowrap;
    }
    .page-title {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gray-light);
      font-size: .85rem;
      padding-left: 1rem;
      border-left: 1px solid rgba(255,255,255,.25);
    }
    .count-badge {
      border-radius: 999px;
      padding: .25rem .8rem;
      font-family: var(--font-body);
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-pending { background: var(--amber-100); color: var(--amber-700); }
    .badge-clear   { background: var(--green-100); color: var(--green-700); }

    .header-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem clamp(1rem, 3vw, 2rem);
    }
    .header-links a {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .85rem;
      color: var(--white);
      transition: color .2s;
      white-space: nowrap;
    }
    .header-links a:hover { color: var(--gold); }
    @media (max-width: 700px) {
      .page-header { justify-content: center; text-align: center; }
      .header-left, .header-links { justify-content: center; width: 100%; }
    }

    /* ── Layout ── */
    main {
      flex: 1;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    .queue-heading {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--white);
      margin-bottom: 1.25rem;
    }

    /* ── Mod card ── */
    .mod-card {
      background: var(--gray-lighter);
      border: 1px solid rgba(207,184,124,.6);
      border-radius: var(--radius);
      display: flex;
      gap: 0;
      overflow: hidden;
      margin-bottom: 1rem;
      transition: opacity .4s, transform .4s;
    }
    .mod-card.card-approved {
      opacity: 0;
      transform: translateX(40px);
    }
    .mod-card.card-rejected {
      opacity: 0;
      transform: translateX(-40px);
    }

    .mod-photo {
      width: 180px;
      flex-shrink: 0;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mod-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .mod-no-photo { font-size: 3rem; }

    .mod-body {
      flex: 1;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
      min-width: 0;
    }

    .mod-desc {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--black);
    }
    .mod-how {
      font-size: .85rem;
      color: var(--gray-700);
      line-height: 1.4;
    }

    /* User row */
    .mod-user {
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .mod-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--gold);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      font-weight: 700;
      overflow: hidden;
    }
    .mod-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .mod-avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mod-user-info {
      display: flex;
      flex-direction: column;
      gap: .05rem;
      flex: 1;
      min-width: 0;
    }
    .mod-name {
      font-size: .875rem;
      font-weight: 700;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mod-handle {
      font-size: .775rem;
      color: var(--gray-700);
    }
    .mod-time {
      font-size: .775rem;
      color: var(--gray-700);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Action buttons */
    .mod-actions {
      display: flex;
      gap: .75rem;
      margin-top: auto;
    }
    .approve-btn,
    .reject-btn {
      flex: 1;
      padding: .55rem;
      border: none;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .2s, color .2s, opacity .2s;
    }
    .approve-btn {
      background: var(--green-100);
      color: var(--green-700);
    }
    .approve-btn:hover:not(:disabled) { background: var(--green-500); color: var(--white); }
    .reject-btn {
      background: var(--red-100);
      color: var(--red-700);
    }
    .reject-btn:hover:not(:disabled) { background: var(--red-600); color: var(--white); }
    .approve-btn:disabled,
    .reject-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── States ── */
    .empty-msg, .loading-msg {
      color: var(--gray-light);
      font-size: .95rem;
      padding: 3rem 0;
      text-align: center;
    }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: clamp(.75rem, 3vw, 1.5rem);
      padding: 1rem clamp(1.25rem, 4vw, 2.5rem) clamp(1.5rem, 5vh, 3.5rem);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: clamp(.65rem, 1.6vw, .85rem);
      text-transform: uppercase;
      color: var(--white);
      margin-top: auto;
    }
    .footer-link {
      text-decoration: none;
      color: var(--white);
      justify-self: end;
    }
    .footer-link:hover { color: var(--white); }
    .footer-logo { height: clamp(24px, 8vw, 54px); width: auto; justify-self: center; }
    .footer-text { justify-self: start; }

    @media (max-width: 560px) {
      footer {
        column-gap: clamp(.4rem, 2vw, .75rem);
        font-size: clamp(.55rem, 2.4vw, .7rem);
        text-align: center;
      }
      .footer-link, .footer-text { justify-self: center; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="header-left">
      <a href="index.html" class="logo">THE LUNCH GAMES</a>
      <span class="page-title">Moderation</span>
      <span id="pending-badge" class="count-badge badge-pending">— pending</span>
    </div>
    <nav class="header-links">
      <a href="profile.html">My Profile</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <h2 class="queue-heading">Pending Meals</h2>
    <div id="queue-grid"></div>
  </main>

  <footer>
    <a href="https://lab.whaaat.io" class="footer-link">From the humans of whaaaat!?</a>
    <img src="images/silversaucerlogo.svg" alt="The Society of the Silver Saucers" class="footer-logo">
    <span class="footer-text">The society of the silver saucers</span>
  </footer>

  <script type="module" src="js/moderation.js"></script>
</body>
</html>
