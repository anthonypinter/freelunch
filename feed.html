<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lunch Games | Feed</title>
  <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Lunch Games" />
  <link rel="manifest" href="/images/favicon/site.webmanifest" />
  <link rel="stylesheet" href="https://use.typekit.net/otp1fyf.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:      #000000;
      --white:      #ffffff;
      --gold:       #CFB87C;
      --gray-light: #A2A4A3;
      --gray-lighter: #E8E8E8;

      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-500:  #6b7280;
      --gray-200:  #e5e7eb;
      --gray-100:  #f3f4f6;

      --font-display: "cheap-pine", sans-serif;
      --font-body:    "ivystyle-sans", sans-serif;

      --radius:    12px;
    }

    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Header ── */
    .page-header {
      background: var(--black);
      flex-wrap: wrap;
      row-gap: .5rem;
      padding: .75rem clamp(1.25rem, 4vw, 2.5rem);
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem 1rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.35rem);
      letter-spacing: .03em;
      color: var(--gold);
      white-space: nowrap;
    }
    .header-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem clamp(1rem, 3vw, 2rem);
    }
    .header-links a {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: clamp(.75rem, 1.6vw, .85rem);
      color: var(--white);
      transition: color .2s;
      white-space: nowrap;
    }
    .header-links a:hover { color: var(--gold); }
    .header-links a.active { color: var(--gold); }
    @media (max-width: 700px) {
      .page-header { justify-content: center; text-align: center; }
      .logo-group, .header-links { justify-content: center; width: 100%; }
    }

    /* ── Page layout ── */
    main {
      flex: 1;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    .feed-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      margin-bottom: 1.25rem;
    }
    .feed-heading {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 2.2rem;
      letter-spacing: .02em;
      color: var(--white);
    }
    .sort-toggle {
      display: inline-flex;
      border: 1px solid rgba(207,184,124,.5);
      border-radius: 999px;
      overflow: hidden;
    }
    .sort-btn {
      background: none;
      border: none;
      color: var(--gray-light);
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: .75rem;
      padding: .5rem 1rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .sort-btn.active { background: var(--gold); color: var(--black); }
    .sort-btn:not(.active):hover { color: var(--white); }

    /* ── Meals grid ── */
    .meals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.1rem;
    }

    .meal-card {
      background: var(--gray-lighter);
      border: 1px solid rgba(207,184,124,.4);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .2s;
    }
    .meal-card:hover { border-color: var(--gold); }

    .meal-photo {
      aspect-ratio: 4/3;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .meal-photo img { width: 100%; height: 100%; object-fit: cover; }
    .meal-no-photo { display: inline-flex; width: 2.5rem; height: 2.5rem; color: var(--gray-500); }

    .meal-info {
      padding: .85rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }
    .meal-desc {
      font-size: .9rem;
      font-weight: 500;
      color: var(--black);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    .meal-how {
      font-size: .8rem;
      color: var(--gray-700);
      line-height: 1.4;
    }

    .meal-user {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding-top: .5rem;
      border-top: 1px solid rgba(0,0,0,.1);
    }
    .user-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .user-avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      font-size: .75rem;
      font-weight: 700;
      color: var(--black);
    }
    .meal-user-name {
      font-size: .78rem;
      font-weight: 700;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .meal-time {
      font-size: .72rem;
      color: var(--gray-500);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .meal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .vote-group {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--white);
      border: 1px solid rgba(0,0,0,.15);
      border-radius: 999px;
      padding: .3rem .55rem;
    }
    .vote-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      background: none;
      border: none;
      color: var(--gray-500);
      cursor: pointer;
      transition: color .15s, transform .1s;
    }
    .vote-arrow svg { width: 15px; height: 15px; }
    .vote-arrow:hover { color: var(--gray-900); }
    .vote-arrow:active { transform: scale(.9); }
    .vote-arrow:disabled { opacity: .6; cursor: default; }
    .vote-arrow.up.active   { color: var(--gold); }
    .vote-arrow.down.active { color: #dc2626; }
    .vote-score {
      font-family: var(--font-body);
      font-weight: 800;
      font-size: .85rem;
      color: var(--black);
      min-width: 1.4rem;
      text-align: center;
    }

    /* ── Empty / loading ── */
    .empty-msg, .loading-msg {
      color: var(--gray-light);
      font-size: .95rem;
      padding: 2rem 0;
      grid-column: 1 / -1;
    }
    .empty-msg a { color: var(--gold); font-weight: 700; text-decoration: none; }
    .empty-msg a:hover { text-decoration: underline; }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: clamp(.75rem, 3vw, 1.5rem);
      padding: 1rem clamp(1.25rem, 4vw, 2.5rem) clamp(1.5rem, 5vh, 3.5rem);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: clamp(.65rem, 1.6vw, .85rem);
      text-transform: uppercase;
      color: var(--white);
    }
    .footer-link {
      text-decoration: none;
      color: var(--white);
      justify-self: end;
    }
    .footer-link:hover { color: var(--white); }
    .footer-logo { height: clamp(24px, 8vw, 54px); width: auto; justify-self: center; }
    .footer-text { justify-self: start; }

    @media (max-width: 560px) {
      footer {
        column-gap: clamp(.4rem, 2vw, .75rem);
        font-size: clamp(.55rem, 2.4vw, .7rem);
        text-align: center;
      }
      .footer-link, .footer-text { justify-self: center; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="logo-group">
      <a href="index.html" class="logo">THE LUNCH GAMES</a>
    </div>
    <nav class="header-links">
      <a href="index.html">Home</a>
      <a href="faq.html">FAQs</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="feed.html" class="active">Feed</a>
      <a href="profile.html" id="profile-nav-link" hidden>My Profile</a>
      <a href="login.html" id="login-nav-link">Log In to Vote</a>
    </nav>
  </header>

  <main>
    <div class="feed-heading-row">
      <h1 class="feed-heading">Meal Feed</h1>
      <div class="sort-toggle">
        <button class="sort-btn active" id="sort-recent" data-sort="recent">Recent</button>
        <button class="sort-btn" id="sort-loved" data-sort="loved">Most Loved</button>
      </div>
    </div>

    <div id="meals-grid" class="meals-grid">
      <p class="loading-msg">Loading meals…</p>
    </div>
  </main>

  <footer>
    <a href="https://lab.whaaat.io" class="footer-link">From the humans of whaaaat!?</a>
    <img src="images/silversaucerlogo.svg" alt="The Society of the Silver Saucers" class="footer-logo">
    <span class="footer-text">The society of the silver saucers</span>
  </footer>

  <script type="module" src="js/feed.js"></script>
</body>
</html>
