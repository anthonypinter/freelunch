<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lunch Games | Home</title>
  <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Lunch Games" />
  <link rel="manifest" href="/images/favicon/site.webmanifest" />
  <link rel="stylesheet" href="https://use.typekit.net/otp1fyf.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-900: #1b4332;
      --green-700: #2d6a4f;
      --green-500: #40916c;
      --green-400: #52b788;
      --green-100: #d8f3dc;
      --green-50:  #f0faf4;
      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-500:  #6b7280;
      --gray-200:  #e5e7eb;
      --gray-100:  #f3f4f6;
      --white:     #ffffff;
      --radius:    12px;

      --black: #000000;
      --gold:  #CFB87C;
      --gray-light: #A2A4A3;

      --font-display: "cheap-pine", sans-serif;
      --font-body:    "ivystyle-sans", sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--black);
      color: var(--white);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Nav ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      row-gap: .5rem;
      padding: .75rem clamp(1.25rem, 4vw, 2.5rem);
      min-height: 92px;
      background: var(--black);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.35rem);
      letter-spacing: .03em;
      color: var(--gold);
      white-space: nowrap;
    }
    .nav-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem clamp(1rem, 3vw, 2rem);
    }
    @media (max-width: 560px) {
      .nav { justify-content: center; text-align: center; }
      .nav-right { justify-content: center; width: 100%; }
    }
    .nav-link {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: clamp(.75rem, 1.6vw, .9rem);
      color: var(--white);
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--gold); }

    /* ── Hero main (image + actions, centered as a group) ── */
    .hero-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      justify-content: safe center;
    }

    /* ── Hero image ── */
    .hero-image-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(.75rem, 3dvh, 2rem) 1.5rem;
    }
    .hero-image-wrap img {
      width: auto;
      height: auto;
      max-width: min(720px, 100%);
      max-height: clamp(180px, 54dvh, 700px);
      object-fit: contain;
    }

    /* ── Hero actions ── */
    .hero-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(.6rem, 2vw, 1.25rem);
      padding: 0 1.5rem clamp(1.25rem, 4dvh, 3rem);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .hero-btn {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: clamp(.8rem, 1.8vw, 1rem);
      padding: clamp(.7rem, 1.8dvh, 1.05rem) clamp(1.3rem, 3.4vw, 2rem);
      border-radius: 12px;
      border: 2px solid var(--gold);
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .hero-btn-outline {
      background: var(--black);
      color: var(--gold);
    }
    .hero-btn-outline:hover {
      background: var(--gold);
      color: var(--black);
    }
    .hero-btn-solid {
      background: var(--gold);
      color: var(--black);
    }
    .hero-btn-solid:hover {
      background: var(--black);
      color: var(--gold);
    }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: clamp(.75rem, 3vw, 1.5rem);
      padding: 1rem clamp(1.25rem, 4vw, 2.5rem) clamp(1.5rem, 5dvh, 3.5rem);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: clamp(.65rem, 1.6vw, .85rem);
      text-transform: uppercase;
      color: var(--white);
    }
    .footer-link {
      text-decoration: none;
      color: var(--white);
      justify-self: end;
    }
    .footer-link:hover { color: var(--white); }
    .footer-logo { height: clamp(34px, 6dvh, 54px); width: auto; justify-self: center; }
    .footer-text { justify-self: start; }

    /* ── Narrow screens: stack footer to avoid squeezing the text columns ── */
    @media (max-width: 560px) {
      footer {
        grid-template-columns: 1fr;
        justify-items: center;
        row-gap: .6rem;
        text-align: center;
      }
      .footer-link, .footer-text { justify-self: center; }
      .hero-actions { gap: .75rem; }
    }
  </style>
</head>
<body>

  <!-- ── Nav ── -->
  <nav class="nav">
    <a href="index.html" class="logo">THE LUNCH GAMES</a>
    <div class="nav-right">
      <a href="index.html" class="nav-link">Home</a>
      <a href="faq.html" class="nav-link">FAQs</a>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="login.html" class="nav-link" id="signin-nav-btn">Login</a>
    </div>
  </nav>

  <div class="hero-main">
    <div class="hero-image-wrap">
      <img src="images/home-hero.svg" alt="The Lunch Games">
    </div>

    <div class="hero-actions">
      <a href="faq.html" class="hero-btn hero-btn-outline">Learn More</a>
      <a href="dashboard.html" class="hero-btn hero-btn-solid">Live Dashboard</a>
      <a href="login.html" class="hero-btn hero-btn-outline">Join the Fray</a>
    </div>
  </div>

  <footer>
    <a href="https://lab.whaaat.io" class="footer-link">From the humans of whaaaat!?</a>
    <img src="images/silversaucerlogo.svg" alt="The Society of the Silver Saucers" class="footer-logo">
    <span class="footer-text">The society of the silver saucers</span>
  </footer>

  <script type="module">
    import { supabase } from './js/supabase.js'

    const { data: { session } } = await supabase.auth.getSession()
    if (session) {
      const signinBtn = document.getElementById('signin-nav-btn')
      signinBtn.href = 'profile.html'
      signinBtn.textContent = 'Profile'
    }
  </script>
</body>
</html>
