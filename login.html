<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lunch Games | Sign In</title>
  <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Lunch Games" />
  <link rel="manifest" href="/images/favicon/site.webmanifest" />
  <link rel="stylesheet" href="https://use.typekit.net/otp1fyf.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { visibility: hidden; }

    :root {
      --black:      #000000;
      --white:      #ffffff;
      --gold:       #CFB87C;
      --gray-light: #A2A4A3;
      --gray-lighter: #E8E8E8;

      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-500:  #6b7280;
      --gray-200:  #e5e7eb;
      --red-100:   #fee2e2;
      --red-700:   #b91c1c;

      --font-display: "cheap-pine", sans-serif;
      --font-body:    "ivystyle-sans", sans-serif;

      --radius: 12px;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }
    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--white);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* ── Nav ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      row-gap: .5rem;
      padding: .75rem clamp(1.25rem, 4vw, 2.5rem);
      min-height: 92px;
      background: var(--black);
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.5vw, 2.35rem);
      letter-spacing: .03em;
      color: var(--gold);
      white-space: nowrap;
    }
    .nav-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem clamp(1rem, 3vw, 2rem);
    }
    .nav-link {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: clamp(.75rem, 1.6vw, .9rem);
      color: var(--white);
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--gold); }
    @media (max-width: 560px) {
      .nav { justify-content: center; text-align: center; }
      .nav-right { justify-content: center; width: 100%; }
    }

    /* ── Card ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--gray-lighter);
      border: 1px solid rgba(207,184,124,.6);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid rgba(0,0,0,.15);
    }
    .auth-tab {
      flex: 1;
      padding: 1rem;
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-align: center;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--gray-700);
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .auth-tab:hover { color: var(--black); }
    .auth-tab.active {
      color: var(--black);
      border-bottom-color: var(--gold);
    }

    /* ── Form body ── */
    .auth-body { padding: 1.75rem; }

    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-family: var(--font-body);
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--gray-700);
      margin-bottom: .4rem;
    }
    .field input {
      width: 100%;
      padding: .65rem .85rem;
      border: 1.5px solid rgba(0,0,0,.2);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: .95rem;
      color: var(--black);
      background: var(--white);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(207,184,124,.3);
    }
    .field input::placeholder { color: var(--gray-500); }

    /* ── Message ── */
    .auth-message {
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .875rem;
      font-weight: 500;
      margin-bottom: 1.1rem;
      background: var(--red-100);
      color: var(--red-700);
    }
    .auth-message.success { background: rgba(207,184,124,.2); color: var(--black); }

    /* ── Submit ── */
    .submit-btn {
      width: 100%;
      padding: .8rem;
      background: var(--gold);
      color: var(--black);
      border: 2px solid var(--gold);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: .9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      cursor: pointer;
      transition: background .2s, color .2s;
      margin-top: .25rem;
    }
    .submit-btn:hover:not(:disabled) { background: var(--black); color: var(--gold); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: clamp(.75rem, 3vw, 1.5rem);
      padding: 1rem clamp(1.25rem, 4vw, 2.5rem) clamp(1.5rem, 5vh, 3.5rem);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: clamp(.65rem, 1.6vw, .85rem);
      text-transform: uppercase;
      color: var(--white);
    }
    .footer-link {
      text-decoration: none;
      color: var(--white);
      justify-self: end;
    }
    .footer-link:hover { color: var(--white); }
    .footer-logo { height: clamp(24px, 8vw, 54px); width: auto; justify-self: center; }
    .footer-text { justify-self: start; }

    @media (max-width: 560px) {
      footer {
        column-gap: clamp(.4rem, 2vw, .75rem);
        font-size: clamp(.55rem, 2.4vw, .7rem);
        text-align: center;
      }
      .footer-link, .footer-text { justify-self: center; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">THE LUNCH GAMES</a>
    <div class="nav-right">
      <a href="index.html" class="nav-link">Home</a>
      <a href="faq.html" class="nav-link">FAQs</a>
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="feed.html" class="nav-link">Feed</a>
    </div>
  </nav>

  <main>
    <div class="auth-card">

      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="signin">Sign In</button>
        <button class="auth-tab"        data-mode="register">Create Account</button>
      </div>

      <div class="auth-body">

        <div id="auth-error" class="auth-message" hidden></div>

        <form id="auth-form" novalidate>

          <!-- Register-only fields -->
          <div class="field" id="row-name" hidden>
            <label for="display-name">Full Name</label>
            <input id="display-name" name="name" type="text" placeholder="Jane Smith" autocomplete="name">
          </div>

          <div class="field" id="row-username" hidden>
            <label for="username">Username</label>
            <input id="username" name="nickname" type="text" placeholder="janesmith" autocomplete="nickname"
                   pattern="[a-z0-9_]+" title="Letters, numbers, and underscores only">
          </div>

          <!-- Shared fields -->
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@colorado.edu"
                   autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••"
                   autocomplete="current-password" required>
          </div>

          <!-- Register-only confirm -->
          <div class="field" id="row-confirm" hidden>
            <label for="confirm-password">Confirm Password</label>
            <input id="confirm-password" name="confirm-password" type="password" placeholder="••••••••"
                   autocomplete="new-password">
          </div>

          <button class="submit-btn" id="submit-btn" type="submit">Sign In</button>

        </form>
      </div>

    </div>
  </main>

  <footer>
    <a href="https://lab.whaaat.io" class="footer-link">From the humans of whaaaat!?</a>
    <img src="images/silversaucerlogo.svg" alt="The Society of the Silver Saucers" class="footer-logo">
    <span class="footer-text">The society of the silver saucers</span>
  </footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
